[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spreadsheet-guard"
version = "0.1.0"
description = "Read-only workbook Guard CLI: compare two Excel workbooks and get a machine-readable damage report"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Wolfgang Schoenberger" }]
keywords = ["excel", "xlsx", "spreadsheet", "diff", "validation", "guard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = []

[project.urls]
Homepage = "https://wolfxl.com"
Repository = "https://github.com/SynthGL/spreadsheet-guard"

[project.scripts]
spreadsheet-guard = "spreadsheet_guard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spreadsheet_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
